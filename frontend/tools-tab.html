<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Инструмент — Promonta Mini App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --primary: #13325C;
  --primary-dark: #0f172a;
  --secondary: #334155;
  --accent: #f59e0b;
  --accent-hover: #d97706;
  --text-main: #334155;
  --text-light: #64748b;
  --bg-light: #f8fafc;
  --bg-white: #ffffff;
  --border-color: #e2e8f0;
  --font-heading: 'Outfit', sans-serif;
  --font-body: 'Montserrat', sans-serif;
  --spacing-xs: 0.5rem;
  --spacing-sm: 1rem;
  --spacing-md: 2rem;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --green: #16a34a;
  --yellow: #f59e0b;
  --red: #dc2626;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg-light);
  color: var(--text-main);
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: 2rem;
}

.role-toggle {
  display: flex;
  gap: 0.4rem;
  padding: 0.75rem 1rem 0;
}

.role-btn {
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-color);
  background: var(--bg-white);
  color: var(--text-light);
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
}

.role-btn.active { background: var(--primary-dark); border-color: var(--primary-dark); color: white; }

header {
  padding: 1.25rem 1rem 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-family: var(--font-heading);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary-dark);
}

.fab {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  border: none;
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
  cursor: pointer;
}

.search-bar {
  padding: 0 1rem 0.75rem;
}

.search-bar input {
  width: 100%;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 0.9rem;
  background: var(--bg-white);
  color: var(--text-main);
}

.search-bar input::placeholder { color: var(--text-light); }

.filters {
  display: flex;
  gap: 0.5rem;
  padding: 0 1rem 0.9rem;
  overflow-x: auto;
}

.filter-chip {
  flex-shrink: 0;
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--bg-white);
  border: 1px solid var(--border-color);
  color: var(--text-light);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.filter-chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.cards {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  padding: 0 1rem;
}

.card {
  background: var(--bg-white);
  border-radius: var(--radius-lg);
  padding: 1.1rem 1.25rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.75rem;
}

.card-top > div:first-child {
  min-width: 0;
  flex: 1;
}

.card-title {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 1rem;
  color: var(--primary-dark);
}

.card-meta {
  font-size: 0.8rem;
  color: var(--text-light);
  margin-top: 2px;
}

.badge {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  white-space: nowrap;
  flex-shrink: 0;
}

.badge.free { background: #dcfce7; color: #15803d; }
.badge.in-use { background: #fef3c7; color: #92400e; }
.badge.repair { background: #fee2e2; color: #b91c1c; }
.badge.missing { background: #e2e8f0; color: #475569; }

.card-body {
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.info-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
}

.info-row span:first-child { color: var(--text-light); }
.info-row span:last-child { color: var(--text-main); font-weight: 500; text-align: right; }

.history-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-light);
  margin-top: 0.6rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
}

.history-label .chevron {
  font-size: 0.65rem;
  transition: transform 0.2s;
  display: inline-block;
}

.history-label.collapsed .chevron { transform: rotate(-90deg); }

.history-body {
  overflow: hidden;
  max-height: 300px;
  transition: max-height 0.25s ease;
  margin-top: 0.4rem;
}

.history-body.collapsed { max-height: 0; margin-top: 0; }

.history-row {
  display: flex;
  gap: 0.6rem;
  font-size: 0.8rem;
  padding: 0.3rem 0;
  border-left: 2px solid var(--border-color);
  padding-left: 0.6rem;
  margin-left: 3px;
}

.history-row .h-date { color: var(--text-light); white-space: nowrap; }
.history-row .h-text { color: var(--text-main); }

.history-empty {
  font-size: 0.8rem;
  color: var(--text-light);
  padding: 0.3rem 0;
}

.empty-state {
  padding: 2rem 1rem;
  text-align: center;
  color: var(--text-light);
  font-size: 0.9rem;
}

.take-btn {
  width: 100%;
  margin-top: 0.75rem;
  padding: 0.55rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--primary);
  background: var(--bg-white);
  color: var(--primary);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.take-btn:active { background: var(--primary); color: white; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.modal {
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  background: var(--bg-white);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.modal-input, .modal-select { scroll-margin-top: 1rem; scroll-margin-bottom: 8rem; }

.modal-title {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 1.05rem;
  color: var(--primary-dark);
  margin-bottom: 0.5rem;
}

.modal-label {
  font-size: 0.8rem;
  color: var(--text-light);
  font-weight: 600;
  margin-top: 0.4rem;
}

.modal-select, .modal-input {
  width: 100%;
  padding: 0.6rem 0.75rem;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 0.9rem;
  background: var(--bg-white);
  color: var(--text-main);
}

.modal-actions {
  display: flex;
  gap: 0.6rem;
  margin-top: 1rem;
}

.modal-btn {
  flex: 1;
  padding: 0.65rem;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  border: none;
}

.modal-btn.secondary { background: var(--bg-light); color: var(--text-main); }
.modal-btn.primary { background: var(--primary); color: white; }
</style>
</head>
<body>

<header>
  <h1>Инструмент</h1>
  <button class="fab" id="add-tool" style="display:none">+</button>
</header>

<div class="search-bar">
  <input type="text" id="search" placeholder="Поиск по названию или категории...">
</div>

<div class="filters" id="filters">
  <div class="filter-chip active" data-filter="all">Все</div>
  <div class="filter-chip" data-filter="free">Свободен</div>
  <div class="filter-chip" data-filter="in-use">На объекте</div>
  <div class="filter-chip" data-filter="repair">В ремонте</div>
</div>

<div class="cards" id="cards"></div>

<script>
const initData = window.Telegram?.WebApp?.initData;
let TOOLS = [];
let currentRole = 'worker';

// Объекты — те же что на табе "Проекты" + спец-пункт "личное пользование" (без привязки к объекту)
const OBJECTS = ['Дом Мюллер', 'Офис Санация', 'Квартира Вебер'];
const PERSONAL_USE = 'Личное пользование';

const STATUS_LABEL = { free: 'Свободен', 'in-use': 'На объекте', repair: 'В ремонте', missing: 'Не найден' };
const RAW_STATUS_MAP = { 'на объекте': 'in-use', 'в ремонте': 'repair', 'не найден': 'missing' };

function mapStatus(raw) {
  const r = (raw || '').trim().toLowerCase();
  return RAW_STATUS_MAP[r] || 'free';
}

const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:8001' : '';

function api(path, options = {}) {
  return fetch(API_BASE + path, {
    ...options,
    headers: { 'X-Telegram-Init-Data': initData, 'Content-Type': 'application/json', ...(options.headers || {}) }
  }).then(async res => {
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
    return res.json();
  });
}

function mapTool(raw) {
  return {
    id: raw['Серийный #'],
    name: raw['Название Инструмента'],
    category: raw['Категория'],
    status: mapStatus(raw['Статус']),
    holder: raw['Кто взял'] || null,
    object: raw['Обьект/Адрес'] || null,
    history: []
  };
}

function renderCard(tool) {
  // Worker: только "Взять" когда свободен, дальше — ничего (не может сам исправить кто взял).
  // Owner: всегда "Изменить" — может поправить, если работник забыл отметить.
  let actionBtn = '';
  if (currentRole === 'owner') {
    actionBtn = `<button class="take-btn" data-id="${tool.id}">Изменить</button>`;
  } else if (tool.status === 'free') {
    actionBtn = `<button class="take-btn" data-id="${tool.id}">Взять</button>`;
  }

  return `
  <div class="card" data-id="${tool.id}" data-status="${tool.status}" data-search="${(tool.name + ' ' + tool.category).toLowerCase()}">
    <div class="card-top">
      <div>
        <div class="card-title">${tool.name}</div>
        <div class="card-meta">${tool.category} · №${tool.id}</div>
      </div>
      <span class="badge ${tool.status}">${STATUS_LABEL[tool.status]}</span>
    </div>
    <div class="card-body">
      <div class="info-row"><span>Кто взял</span><span>${tool.holder || '—'}</span></div>
      <div class="info-row"><span>Объект</span><span>${tool.object || '—'}</span></div>
    </div>
    ${actionBtn}
    <div class="history-label collapsed"><span class="chevron">▾</span>История движений</div>
    <div class="history-body collapsed"><div class="history-empty">Загрузка...</div></div>
  </div>`;
}

function openTakeModal(toolId) {
  const tool = TOOLS.find(t => t.id === toolId);
  if (!tool) return;

  const isOwnerEdit = currentRole === 'owner';
  const objectOptions = OBJECTS.map(o =>
    `<option value="${o}" ${tool.object === o ? 'selected' : ''}>${o}</option>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">${tool.name}</div>
      <label class="modal-label">Объект</label>
      <select class="modal-select" id="modal-object">
        <option value="">— не выбрано —</option>
        ${objectOptions}
        <option value="${PERSONAL_USE}" ${tool.object === PERSONAL_USE ? 'selected' : ''}>${PERSONAL_USE}</option>
      </select>
      <label class="modal-label">Кто взял</label>
      <input class="modal-input" id="modal-holder" type="text" placeholder="Имя" value="${isOwnerEdit ? (tool.holder || '') : ''}" ${isOwnerEdit ? '' : 'readonly'}>
      ${isOwnerEdit ? `
      <label class="modal-label">Статус</label>
      <select class="modal-select" id="modal-status">
        <option value="На объекте" ${tool.status === 'in-use' ? 'selected' : ''}>На объекте</option>
        <option value="" ${tool.status === 'free' ? 'selected' : ''}>Свободен</option>
        <option value="В ремонте" ${tool.status === 'repair' ? 'selected' : ''}>В ремонте</option>
        <option value="Не найден" ${tool.status === 'missing' ? 'selected' : ''}>Не найден</option>
      </select>` : ''}
      <div class="modal-actions">
        <button class="modal-btn secondary" id="modal-cancel">Отмена</button>
        <button class="modal-btn primary" id="modal-save">Сохранить</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#modal-cancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#modal-save').addEventListener('click', async () => {
    const object = overlay.querySelector('#modal-object').value;
    const holder = overlay.querySelector('#modal-holder').value.trim();
    const saveBtn = overlay.querySelector('#modal-save');

    if (!isOwnerEdit && (!holder || !object)) {
      alert('Укажи объект и кто взял.');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Сохранение...';
    try {
      if (isOwnerEdit) {
        const status = overlay.querySelector('#modal-status').value;
        await api(`/api/tools/${tool.id}`, { method: 'PATCH', body: JSON.stringify({ status, holder, object_name: object }) });
      } else {
        await api(`/api/tools/${tool.id}/checkout`, { method: 'PATCH', body: JSON.stringify({ holder, object_name: object }) });
      }
      overlay.remove();
      await loadTools();
    } catch (e) {
      alert('Ошибка: ' + e.message);
      saveBtn.disabled = false;
      saveBtn.textContent = 'Сохранить';
    }
  });
}

function openNewToolModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Новый инструмент</div>
      <label class="modal-label">Название</label>
      <input class="modal-input" id="new-name" type="text" placeholder="напр. Bosch дрель">
      <label class="modal-label">Категория</label>
      <input class="modal-input" id="new-category" type="text" placeholder="напр. Дрель">
      <div class="modal-actions">
        <button class="modal-btn secondary" id="modal-cancel">Отмена</button>
        <button class="modal-btn primary" id="modal-save">Добавить</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#modal-cancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#modal-save').addEventListener('click', async () => {
    const name = overlay.querySelector('#new-name').value.trim();
    const category = overlay.querySelector('#new-category').value.trim();
    const saveBtn = overlay.querySelector('#modal-save');

    if (!name || !category) {
      alert('Укажи название и категорию.');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Добавление...';
    try {
      await api('/api/tools', { method: 'POST', body: JSON.stringify({ name, category }) });
      overlay.remove();
      await loadTools();
    } catch (e) {
      alert('Ошибка: ' + e.message);
      saveBtn.disabled = false;
      saveBtn.textContent = 'Добавить';
    }
  });
}

async function openHistory(toolId) {
  const label = document.querySelector(`.card[data-id="${toolId}"] .history-label`);
  const body = label.nextElementSibling;
  const willOpen = label.classList.contains('collapsed');
  label.classList.toggle('collapsed');
  body.classList.toggle('collapsed');
  if (!willOpen || body.dataset.loaded) return;

  try {
    const data = await api(`/api/tools/${toolId}/history`);
    body.dataset.loaded = '1';
    body.innerHTML = data.history.length
      ? data.history.map(h => `<div class="history-row"><span class="h-date">${h.date.split(' ')[0]}</span><span class="h-text">${h.text}</span></div>`).join('')
      : `<div class="history-empty">Движений не было</div>`;
  } catch (e) {
    body.innerHTML = `<div class="history-empty">Ошибка загрузки истории</div>`;
  }
}

function renderAll(list) {
  const container = document.getElementById('cards');
  if (!list.length) {
    container.innerHTML = '<div class="empty-state">Ничего не найдено.</div>';
    return;
  }
  container.innerHTML = list.map(renderCard).join('');
  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll('.history-label').forEach(label => {
    const card = label.closest('.card');
    label.addEventListener('click', () => openHistory(card.dataset.id));
  });

  document.querySelectorAll('.take-btn').forEach(btn => {
    btn.addEventListener('click', () => openTakeModal(btn.dataset.id));
  });
}

document.getElementById('add-tool').addEventListener('click', () => {
  if (currentRole !== 'owner') return;
  openNewToolModal();
});

let activeFilter = 'all';

function applyFilters() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = TOOLS.filter(t => {
    const matchesFilter = activeFilter === 'all' || t.status === activeFilter;
    const matchesSearch = !q || (t.name + ' ' + t.category).toLowerCase().includes(q);
    return matchesFilter && matchesSearch;
  });
  renderAll(filtered);
}

document.getElementById('search').addEventListener('input', applyFilters);

document.getElementById('filters').addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  applyFilters();
});

async function loadTools() {
  const container = document.getElementById('cards');
  try {
    const data = await api('/api/tools');
    TOOLS = data.tools.map(mapTool);
    applyFilters();
  } catch (e) {
    container.innerHTML = `<div class="empty-state">Ошибка загрузки: ${e.message}</div>`;
  }
}

async function init() {
  const container = document.getElementById('cards');

  if (!initData) {
    container.innerHTML = '<div class="empty-state">Открыто вне Telegram — нет initData для авторизации API.</div>';
    return;
  }

  try {
    const me = await api('/api/me');
    currentRole = me.role;
    document.getElementById('add-tool').style.display = currentRole === 'owner' ? 'flex' : 'none';
  } catch (e) {
    container.innerHTML = `<div class="empty-state">Ошибка авторизации: ${e.message}</div>`;
    return;
  }

  await loadTools();
}

window.Telegram?.WebApp?.expand();
init();
</script>

</body>
</html>

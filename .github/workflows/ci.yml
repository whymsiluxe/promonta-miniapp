name: CI

# Release-аудит Этап 7: минимальный набор проверок release-готовности. Работает
# ПОЛНОСТЬЮ offline -- ни одного обращения к реальным Google Sheets/Telegram API/
# production credentials. BOT_TOKEN ниже -- заглушка для теста HMAC-подписи
# (validate_init_data сверяет подпись с этим значением, не настоящим ботом),
# не production secret.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ci-dummy-token-not-a-real-secret
      MINIAPP_DATA_ROOT: /tmp/ci-miniapp-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependency (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Python syntax check (backend/*.py, tests/*.py)
        run: |
          python -m py_compile backend/*.py tests/*.py

      - name: Verify backend/main.py importable in test environment
        run: |
          cd tests && python -c "
          import sys, os
          sys.path.insert(0, os.path.join(os.path.dirname('.'), '..', 'backend'))
          import main
          print('main.py imported OK, routes:', len(main.app.routes))
          "

      - name: Check required repo files exist
        run: |
          test -f backend/tools_lib.py || (echo 'backend/tools_lib.py missing' && exit 1)
          test -f backend/mangel_lib.py || (echo 'backend/mangel_lib.py missing' && exit 1)
          test -f backend/objekte_lib.py || (echo 'backend/objekte_lib.py missing' && exit 1)
          test -f backend/roadmap_lib.py || (echo 'backend/roadmap_lib.py missing' && exit 1)
          test -f backend/angebot_free.js || (echo 'backend/angebot_free.js missing' && exit 1)
          test -f backend/rechnung.js || (echo 'backend/rechnung.js missing' && exit 1)
          test -f backend/main.py || (echo 'backend/main.py missing' && exit 1)
          test -f frontend/app.html || (echo 'frontend/app.html missing' && exit 1)
          test -f scripts/deploy.sh || (echo 'scripts/deploy.sh missing' && exit 1)
          test -f scripts/rollback.sh || (echo 'scripts/rollback.sh missing' && exit 1)
          echo "All required files present"

      - name: Shell syntax check (deploy/rollback scripts)
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/rollback.sh
          echo "deploy.sh/rollback.sh syntax OK"

      - name: Check for unresolved merge conflict markers
        run: |
          ! grep -rE "^(<<<<<<<|=======|>>>>>>>)" --include="*.py" --include="*.js" --include="*.html" backend/ frontend/ tests/

      - name: Check for obvious committed secrets
        run: |
          # Ищем реальные значения секретов, не сами имена переменных (BOT_TOKEN=
          # os.environ[...] -- нормальный код, BOT_TOKEN=123456:ABC-DEF... -- утечка).
          FOUND=0
          if grep -rEn 'BOT_TOKEN\s*=\s*["\x27][0-9]+:[A-Za-z0-9_-]{30,}' backend/ frontend/ 2>/dev/null; then FOUND=1; fi
          if grep -rEn '\-\-\-\-\-BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY\-\-\-\-\-' . --exclude-dir=.git 2>/dev/null; then FOUND=1; fi
          if grep -rEn '"refresh_token"\s*:\s*"[^"]{20,}"' backend/ frontend/ 2>/dev/null; then FOUND=1; fi
          if grep -rEn '"client_secret"\s*:\s*"[^"]{10,}"' backend/ frontend/ 2>/dev/null; then FOUND=1; fi
          if [ -f backend/.sheets.json ] || [ -f .sheets.json ]; then echo "found .sheets.json in repo"; FOUND=1; fi
          if [ -f backend/roles.json ] || [ -f roles.json ]; then echo "found production roles.json in repo"; FOUND=1; fi
          if [ "$FOUND" = "1" ]; then exit 1; fi
          echo "No obvious secrets found"

      - name: Run full test suite
        run: |
          cd tests && python -m pytest . -q

      - name: JS syntax check (frontend/js/*.js + backend PDF scripts)
        run: |
          for f in frontend/js/*.js; do
            node --check "$f" || exit 1
          done
          node --check backend/angebot_free.js
          node --check backend/rechnung.js
          echo "All JS files syntax-OK"
